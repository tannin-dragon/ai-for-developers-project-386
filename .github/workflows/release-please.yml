name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # PAT вместо GITHUB_TOKEN, чтобы коммиты/PR от release-please
          # запускали остальные workflow (e2e.yml) — GITHUB_TOKEN этого не делает.
          token: ${{ secrets.CALLENDAR }}
          # Базовая стратегия: версия из корневого package.json (0.1.0),
          # CHANGELOG.md и теги вида vX.Y.Z. Требует Conventional Commits.
          release-type: node

      - name: Attach OpenAPI spec to release
        if: ${{ steps.release.outputs.release_created }}
        run: |
          npm install
          npx tsp compile .
          gh release upload "${{ steps.release.outputs.tag_name }}" tsp-output/schema/openapi.yaml
        env:
          GH_TOKEN: ${{ secrets.CALLENDAR }}