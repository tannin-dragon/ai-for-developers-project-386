name: callendar-e2e

# CI-specific compose: минимальный набор для E2E (api + nginx).
# Корнем монтирования выступает САМ репозиторий (в GitHub Actions checkout кладёт
# содержимое репозитория в корень раннера), поэтому пути здесь — без префикса /public:
#   backend  -> /var/www/backend
#   frontend/dist -> /var/www/frontend/dist
# Локальный dev-стек (php, mariadb, mailpit, memcached, ../certs) в CI не нужен.

services:
  api:
    image: node:22-alpine
    working_dir: /var/www/backend
    command: ["node", "dist/index.js"]
    environment:
      PORT: "3000"
      OWNER_KEY: ${OWNER_KEY:-dev-owner-key}
      SEED_DEMO: ${SEED_DEMO:-true}
    volumes:
      - .:/var/www
    networks:
      - app

  nginx:
    image: nginx:latest
    volumes:
      - .:/var/www
      - ./e2e/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${E2E_NGINX_PORT:-8080}:80"
    depends_on:
      - api
    networks:
      - app

networks:
  app:
    driver: bridge